<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Federal University Dutse Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-gavel text-warning me-2"></i> Federal University Dutse Marketplace
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Marketplace</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-3">
          <div class="card-body p-4 p-md-5">
            <h3 class="fw-bold text-dark text-center mb-1">Welcome Back</h3>
            <p class="text-muted text-center mb-4 small">Sign in to manage your campus bids and auctions.</p>

            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-bold">Email Address</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="student@fud.edu.ng" required>
              </div>

              <!-- Password Input with Toggle Eye -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="loginPassword" class="form-label fw-bold mb-0">Password</label>
                  <a href="reset-password.html" class="small text-decoration-none text-primary fw-bold">Forgot Password?</a>
                </div>
                <div class="input-group mt-2">
                  <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary" type="button" id="toggleLoginPass">
                    <i class="bi bi-eye-slash" id="loginEyeIcon"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-gold btn-lg w-100 fw-bold mb-3 mt-2">
                Sign In
              </button>

              <div class="text-center">
                <small class="text-muted">Don't have an account yet? <a href="register.html" class="fw-bold text-decoration-none">Create Account Here</a></small>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Toggle Password Visibility
    document.getElementById('toggleLoginPass').addEventListener('click', function() {
      const passInput = document.getElementById('loginPassword');
      const eyeIcon = document.getElementById('loginEyeIcon');
      
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
      }
    });
  </script>
</body>
</html>
