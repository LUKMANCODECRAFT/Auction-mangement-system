<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Federal University Dutse Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-gavel text-warning me-2"></i> Federal University Dutse Marketplace
      </a>
      <div class="ms-auto d-flex align-items-center" id="navAuthActions"></div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-0"><i class="bi bi-bell-fill text-warning me-2"></i> Activity Alerts & Notifications</h3>
        <small class="text-muted">Real-time alerts for live bids, outbid events, and winning passes.</small>
      </div>
      <button class="btn btn-outline-danger btn-sm fw-bold" onclick="clearNotifications()">
        <i class="bi bi-trash me-1"></i> Clear History
      </button>
    </div>

    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
      <div class="list-group list-group-flush" id="notificationList">
        <div class="text-center py-5 text-muted">
          <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>
          <h6>No Notifications Yet</h6>
          <p class="small">Activity alerts will automatically appear here as you interact with auctions.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function renderNotifications() {
      const container = document.getElementById('notificationList');
      const history = JSON.parse(localStorage.getItem('fud_notifications') || '[]');

      if (history.length === 0) {
        container.innerHTML = `
          <div class="text-center py-5 text-muted">
            <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>
            <h6>No Notifications Yet</h6>
            <p class="small">Activity alerts will automatically appear here as you interact with auctions.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      history.forEach(item => {
        const badgeBg = item.type === 'success' ? 'bg-fud-green' : (item.type === 'danger' ? 'bg-secondary' : 'bg-gold');
        
        container.innerHTML += `
          <div class="list-group-item p-4 d-flex justify-content-between align-items-center">
            <div>
              <div class="d-flex align-items-center gap-2 mb-1">
                <span class="badge ${badgeBg}">${item.title}</span>
                <small class="text-muted">${item.time}</small>
              </div>
              <p class="mb-0 text-dark fw-semibold">${item.message}</p>
            </div>
          </div>
        `;
      });
    }

    function clearNotifications() {
      localStorage.removeItem('fud_notifications');
      renderNotifications();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderNotifications();
    });
  </script>
</body>
</html>
