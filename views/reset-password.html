<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Federal University Dutse Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-gavel text-warning me-2"></i> Federal University Dutse Marketplace
      </a>
      <a href="login.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-3">
          <div class="card-body p-4 p-md-5">
            <h3 class="fw-bold text-dark text-center mb-1">Reset Password</h3>
            <p class="text-muted text-center mb-4 small">Enter your campus email address to reset your account password.</p>

            <form id="resetPassForm">
              <div class="mb-3">
                <label for="resetEmail" class="form-label fw-bold">Email Address</label>
                <input type="email" class="form-control" id="resetEmail" placeholder="student@fud.edu.ng" required>
              </div>

              <div class="mb-3">
                <label for="newPassword" class="form-label fw-bold">New Password</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary" type="button" id="toggleResetPass">
                    <i class="bi bi-eye-slash" id="resetEyeIcon"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-gold btn-lg w-100 fw-bold mb-3">
                Reset Password
              </button>

              <div class="text-center">
                <small class="text-muted">Remembered your password? <a href="login.html" class="fw-bold text-decoration-none">Login Here</a></small>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('toggleResetPass').addEventListener('click', function() {
      const passInput = document.getElementById('newPassword');
      const eyeIcon = document.getElementById('resetEyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
      }
    });

    document.getElementById('resetPassForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const newPassword = document.getElementById('newPassword').value;

      if (typeof showToast === 'function') {
        showToast('Password reset request submitted successfully!', 'success');
      } else {
        alert('Password reset request submitted successfully!');
      }

      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    });
  </script>
</body>
</html>
